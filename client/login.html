<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - StudyStack</title>

    <link rel="icon" type="image/png" href="asset/studystack-logo.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="bg-light">

<div id="toastContainer"></div>

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="row shadow-lg rounded-4 overflow-hidden auth-box">

        <!-- Left Side -->

        <div class="col-md-6 d-none d-md-flex flex-column justify-content-center align-items-center auth-left">

            <i class="bi bi-mortarboard-fill display-1 text-white"></i>

            <h2 class="text-white mt-4 fw-bold">
                Welcome Back
            </h2>

            <p class="text-white text-center px-4">
                Continue managing your study schedule and stay productive.
            </p>

        </div>

        <!-- Right Side -->

        <div class="col-md-6 bg-white p-5">

            <h2 class="fw-bold text-primary mb-4">
                Login
            </h2>

            <form id="loginForm">

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Enter your password"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    Login

                </button>

            </form>

            <p class="text-center mt-4">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

            <div class="text-center mt-3">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/login.js"></script>

</body>

</html>
