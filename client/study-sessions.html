<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Sessions</title>

    <link rel="icon" type="image/png" href="asset/studystack-logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="bg-light">

    <div id="toastContainer"></div>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold text-primary fs-3" href="dashboard.html">
                📚 StudyStack
            </a>

            <button
    id="themeToggle"
    class="btn btn-outline-secondary"
    type="button"
    title="Toggle theme">

    <i id="themeIcon" class="fa-solid fa-moon"></i>

</button>

            <a href="dashboard.html" class="btn btn-outline-primary dashboard-btn">
    <span>Dashboard</span>
</a>

</a>
</a>

        </div>

    </nav>

    <!-- Heading -->

    <div class="container mt-5">

        <div class="d-flex justify-content-between align-items-center">

            <h2 class="fw-bold">
                📖 Study Sessions
            </h2>

            <button
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#sessionModal">

                <i class="fa-solid fa-plus"></i>

                Add Session

            </button>

        </div>

    </div>

    <!-- Table -->

    <!-- Table -->

<div class="container mt-4">

    <div class="card shadow border-0 rounded-4">

        <div class="card-body">

            <div class="study-table-wrapper">

                <table class="table table-hover align-middle study-table">

                    <thead>

                        <tr>

                            <th>Subject</th>
                            <th>Goal</th>
                            <th>Duration</th>
                            <th>Date</th>
                            <th>Start Time</th>
                            <th>Status</th>
                            <th class="action-column">Action</th>

                        </tr>

                    </thead>

                    <tbody id="sessionTable">

                        <tr>

                            <td colspan="7" class="text-center">

                                No Study Sessions Found

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

    <!-- Modal -->

    <div class="modal fade" id="sessionModal">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Add Study Session
                    </h5>

                    <button class="btn-close" data-bs-dismiss="modal"></button>

                </div>

                <div class="modal-body">

                    <div class="mb-3">

                        <label class="form-label">
                            Subject
                        </label>

                        <select
                            class="form-select"
                            id="subject">
                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Study Goal
                        </label>

                        <input
                            type="text"
                            id="goal"
                            class="form-control">

                    </div>

                    <div class="row">

                        <div class="col">

                            <label class="form-label">
                                Duration
                            </label>

                            <input
                                type="number"
                                id="duration"
                                class="form-control">

                        </div>

                        <div class="col">

                            <label class="form-label">
                                Unit
                            </label>

                            <select
                                id="unit"
                                class="form-select">

                                <option>Hours</option>
                                <option>Minutes</option>

                            </select>

                        </div>

                    </div>

                    <div class="mt-3">

                        <label class="form-label">
                            Study Date
                        </label>

                        <input
                            type="date"
                            id="studyDate"
                            class="form-control">

                    </div>

                    <div class="mt-3">

                        <label class="form-label">
                            Start Time
                        </label>

                        <input
                            type="time"
                            id="startTime"
                            class="form-control">

                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        class="btn btn-primary"
                        id="saveSession">

                        Save Session

                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/studySessions.js"></script>

</body>

</html>
