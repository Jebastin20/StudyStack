<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subjects | StudyStack</title>

    <link rel="icon" type="image/png" href="asset/studystack-logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="bg-light">

<div id="toastContainer"></div>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

<div class="container">

<a class="navbar-brand fw-bold text-primary fs-3" href="dashboard.html">
📚 StudyStack
</a>

<button
    id="themeToggle"
    class="btn btn-outline-secondary"
    type="button"
    title="Toggle theme">

    <i id="themeIcon" class="fa-solid fa-moon"></i>

</button>

<a href="dashboard.html" class="btn btn-outline-primary dashboard-btn">
    <span>Dashboard</span>
</a>

</a>

</a>

</div>

</nav>

<div class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2 class="fw-bold">
📚 Subjects
</h2>

<button class="btn btn-primary" id="addSubjectBtn">

<i class="fa-solid fa-plus"></i>

Add Subject

</button>

</div>

<div class="card shadow border-0 rounded-4">

<div class="card-body">

<table class="table align-middle">

<thead>

<tr>

<th>Subject Name</th>
<th>Actions</th>

</tr>

</thead>

<tbody id="subjectTable">

</tbody>

</table>

</div>

</div>

</div>

<!-- Modal -->

<div class="modal fade" id="subjectModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">Add Subject</h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<input
class="form-control mb-3"
id="subjectName"
placeholder="Subject Name">

</div>

<div class="modal-footer">

<button
class="btn btn-secondary"
data-bs-dismiss="modal">
Cancel
</button>

<button
class="btn btn-primary"
id="saveSubject">

Save

</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/subjects.js"></script>

</body>
</html>
