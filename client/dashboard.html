<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyStack Dashboard</title>

    <link rel="icon" type="image/png" href="asset/studystack-logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="bg-light">

    <div id="toastContainer"></div>

    <!-- Navbar -->

<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold text-primary fs-3" href="dashboard.html">
            📚 StudyStack
        </a>

        <button
    id="themeToggle"
    class="btn btn-outline-secondary"
    type="button"
    title="Toggle theme">

    <i id="themeIcon" class="fa-solid fa-moon"></i>

</button>

        <div class="d-flex align-items-center">

   <!-- Notification Bell -->
<div class="position-relative me-3">

    <button
        id="notificationBtn"
        class="notification-btn"
        type="button"
        data-bs-toggle="dropdown"
        aria-expanded="false"
        title="Notifications"
        aria-label="Notifications">

        <i class="fa-solid fa-bell"></i>

        <!-- Unread Count -->
        <span
            id="notificationBadge"
            class="position-absolute top-0 start-100 translate-middle
                   badge rounded-pill bg-danger"
            style="display:none;">
            0
        </span>

    </button>

    <!-- Notification Dropdown -->
    <ul
        id="notificationList"
        class="dropdown-menu dropdown-menu-end shadow border-0 rounded-4"
        style="width:350px; max-height:400px; overflow-y:auto;">

        <li>
            <h6 class="dropdown-header">
                Notifications
            </h6>
        </li>

        <li>
            <p class="text-muted text-center px-3">
                Loading...
            </p>
        </li>

    </ul>

</div>


    <!-- Profile -->

    <a href="profile.html"
   class="text-decoration-none">

    <div
        id="dashboardProfileIcon"
        class="d-flex align-items-center justify-content-center
               rounded-circle bg-light text-primary"
        style="width:40px;height:40px;">

        <i class="fa-solid fa-user"
           style="font-size:20px;"></i>

    </div>

</a>

</div>

    </div>

</nav>

    <!-- Welcome -->

    <div class="container mt-5">

        <div class="p-4 rounded-4 hero-box">

            <h2 class="fw-bold">
                Welcome Back 👋
            </h2>

            <p class="text-muted">
                Organize your studies and achieve your daily goals.
            </p>

        </div>

    </div>

<!-- Statistics -->

<div class="container mt-4">

    <div class="row g-4">

        <!-- Subjects -->

        <div class="col-lg-4 col-md-6">

            <div class="card stat-card">

                <div class="card-body">

                    <i class="fa-solid fa-book text-primary"></i>

                    <h5 class="mt-3">Subjects</h5>

                    <h2 id="subjectCount">0</h2>

                </div>

            </div>

        </div>

        <!-- Today's Study -->

        <div class="col-lg-4 col-md-6">

            <div class="card stat-card">

                <div class="card-body">

                    <i class="fa-solid fa-clock text-success"></i>

                    <h5 class="mt-3">Today's Study</h5>

                    <h2 id="todayHours">0h 0m</h2>

                </div>

            </div>

        </div>

        <!-- Study Streak -->

        <div class="col-lg-4 col-md-12">

            <div class="card stat-card">

                <div class="card-body">

                    <i class="fa-solid fa-fire text-danger"></i>

                    <h5 class="mt-3">Study Streak</h5>

                    <h2 id="streak">0 🔥</h2>

                </div>

            </div>

        </div>

    </div>

</div>

    <!-- Buttons -->

<div class="container text-center action-buttons">

    <a href="subjects.html"
       class="btn btn-primary btn-lg me-3">

        <i class="fa-solid fa-book"></i>

        Subjects

    </a>

    <a href="study-sessions.html"
       class="btn btn-success btn-lg">

        <i class="fa-solid fa-clock"></i>

        Study Sessions

    </a>

</div>

    <!-- Recent Section -->

<div class="container today-card">

    <div class="card shadow border-0 rounded-4">

        <div class="card-body">

            <h4 class="mb-4">

                <h4 class="mb-4">✅ Completed Sessions</h4>

            </h4>

            <div id="todaySessionList">

                <p class="text-muted">
    No Completed Sessions Yet
</p>

            </div>

        </div>

    </div>

</div>
    <!-- Add Subject Modal -->
<div class="modal fade" id="subjectModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Add Subject</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <input
                    type="text"
                    id="subjectName"
                    class="form-control mb-3"
                    placeholder="Subject Name"
                >


            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Cancel
                </button>

                <button
                    class="btn btn-primary"
                    id="saveSubject">
                    Save Subject
                </button>

            </div>

        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/dashboard.js"></script>

</body>

</html>
