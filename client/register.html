<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - StudyStack</title>

    <link rel="icon" type="image/png" href="asset/studystack-logo.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="bg-light">

<div id="toastContainer"></div>

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="row shadow-lg rounded-4 overflow-hidden auth-box">

        <!-- Left Panel -->

        <div class="col-md-6 d-none d-md-flex flex-column justify-content-center align-items-center auth-left">

            <i class="bi bi-person-plus-fill display-1 text-white"></i>

            <h2 class="text-white mt-4 fw-bold">
                Join StudyStack
            </h2>

            <p class="text-white text-center px-4">
                Create your account and organize your study life with ease.
            </p>

        </div>

        <!-- Right Panel -->

        <div class="col-md-6 bg-white p-5">

            <h2 class="fw-bold text-primary mb-4">
                Create Account
            </h2>

            <form id="registerForm">

                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        placeholder="Enter your name"
                        required>

                </div>

                <div class="mb-3">

    <label class="form-label">
        Email
    </label>

    <input
        type="email"
        class="form-control"
        id="email"
        placeholder="Enter your email"
        required>

</div>

<!-- Age -->

<div class="mb-3">

    <label class="form-label">
        Age
    </label>

    <input
        type="number"
        class="form-control"
        id="age"
        placeholder="Enter your age"
        min="1"
        max="120"
        required>

</div>

<!-- Gender -->

<div class="mb-3">

    <label class="form-label">
        Gender
    </label>

    <select
        id="gender"
        class="form-select"
        required>

        <option value="" selected disabled>
            Select Gender
        </option>

        <option value="Male">
            Male
        </option>

        <option value="Female">
            Female
        </option>

        <option value="Other">
            Other
        </option>

    </select>

</div>

<div class="mb-4">

    <label class="form-label">
        Password
    </label>

    <input
        type="password"
        class="form-control"
        id="password"
        placeholder="Create a password"
        required>

</div>

                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    Create Account

                </button>

            </form>

            <p class="text-center mt-4">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

            <div class="text-center mt-3">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/register.js"></script>

</body>

</html>
