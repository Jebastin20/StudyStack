<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - StudyStack</title>

    <link rel="icon" type="image/png" href="asset/studystack-logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="bg-light">

<div id="toastContainer"></div>

<nav class="navbar navbar-expand-lg shadow-sm">

    <div class="container">

        <!-- StudyStack Logo -->
        <a href="dashboard.html"
           class="navbar-brand fw-bold text-primary fs-3">

            <i class="fa-solid fa-layer-group me-2"></i>
            StudyStack

        </a>


        <!-- Theme Toggle -->
        <button
            id="themeToggle"
            class="btn btn-outline-secondary theme-toggle"
            type="button"
            title="Toggle theme"
            aria-label="Toggle theme">

            <i id="themeIcon"
               class="fa-solid fa-moon">
            </i>

        </button>


        <!-- Dashboard -->
        <a href="dashboard.html"
           class="btn btn-outline-primary dashboard-btn ms-3">

            <i class="fa-solid fa-arrow-left me-2"></i>

            <span>Dashboard</span>

        </a>

    </div>

</nav>

<div class="container my-5">

    <div class="row g-4">

        <!-- Profile Card -->

        <div class="col-lg-4">

            <div class="card border-0 shadow rounded-4">

                <div class="card-body text-center">

                    <div class="position-relative d-inline-block">

    <img
    id="profileImage"
    src="https://via.placeholder.com/120"
    alt="Profile Picture"
    class="rounded-circle border border-3 border-primary"
    width="120"
    height="120"
    style="object-fit: cover; cursor: pointer;"
    data-bs-toggle="modal"
    data-bs-target="#profileImageModal"
>

    <label
        for="profilePictureInput"
        class="position-absolute bottom-0 end-0
               bg-primary text-white rounded-circle
               d-flex align-items-center justify-content-center"
        style="width:38px; height:38px; cursor:pointer;">

        <i class="fa-solid fa-camera"></i>

    </label>

    <input
        type="file"
        id="profilePictureInput"
        accept="image/jpeg,image/png,image/webp"
        hidden
    >

</div>

                    <h3 class="mt-3" id="profileName">
                        Loading...
                    </h3>

                    <p class="text-muted" id="profileEmail">
                        Loading...
                    </p>

                    <hr>

                    <button
                        class="btn btn-outline-danger w-100"
                        id="logoutBtn">

                        <i class="fa-solid fa-right-from-bracket me-2"></i>

                        Logout

                    </button>

                </div>

            </div>

        </div>

        <!-- Details -->

        <div class="col-lg-8">

            <div class="card border-0 shadow rounded-4">

                <div class="card-body">

                    <h4 class="mb-4">

                        Personal Information

                    </h4>

                    <table class="table">

                        <tr>
                            <th>Name</th>
                            <td id="name">-</td>
                        </tr>

                        <tr>
                            <th>Email</th>
                            <td id="email">-</td>
                        </tr>

                        <tr>
                            <th>Age</th>
                            <td id="age">-</td>
                        </tr>

                        <tr>
                            <th>Gender</th>
                            <td id="gender">-</td>
                        </tr>

                    </table>

                </div>

            </div>

            <div class="card border-0 shadow rounded-4 mt-4">

                <div class="card-body">

                    <h4 class="mb-4">

                        Study Statistics

                    </h4>

                    <div class="row text-center">

                        <div class="col-md-4">

                            <h2 id="subjectCount">0</h2>

                            <p class="text-muted">

                                Subjects

                            </p>

                        </div>

                        <div class="col-md-4">

                            <h2 id="completedCount">0</h2>

                            <p class="text-muted">

                                Completed

                            </p>

                        </div>

                        <div class="col-md-4">

                            <h2 id="studyHours">0h</h2>

                            <p class="text-muted">

                                Study Hours

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Profile Image Modal -->

<div
    class="modal fade"
    id="profileImageModal"
    tabindex="-1"
    aria-hidden="true"
>

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content border-0 rounded-4">

            <div class="modal-header">

                <h5 class="modal-title">
                    Profile Picture
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body text-center">

                <img
                    id="largeProfileImage"
                    src=""
                    alt="Profile Picture"
                    class="img-fluid rounded-4"
                    style="
                        max-height: 500px;
                        width: auto;
                        object-fit: contain;
                    "
                >

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/profile.js"></script>

</body>

</html>
